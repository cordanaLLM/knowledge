---
# Licence check: every tracked file carries its licence and its copyright holder, as
# `reuse lint` reads them from the file headers, REUSE.toml and LICENSES/.
name: licence
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: licence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's entry point is the tool. It runs as root on a checkout that belongs
      # to the runner's user; without the setting below git refuses the checkout, and
      # the tool then reads every file in the folder, the ones git ignores too. The
      # digest is release 6.2.0.
      - name: reuse lint
        uses: docker://docker.io/fsfe/reuse@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: lint
